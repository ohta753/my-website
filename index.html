<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    .error-message { color: red; font-weight: bold; margin-top: 10px; }
    .success-message { color: green; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <h3>議事録データ取り込み</h3>
  
  <form id="uploadForm">
    <!-- accept属性で画像ファイルのみに制限 -->
    <input type="file" id="fileInput" accept="image/png, image/jpeg, image/jpg" onchange="validateFileSelected(this)" required>
    <br><br>
    <button type="button" onclick="uploadFile()">取り込み実行</button>
  </form>

  <div id="statusMessage"></div>

  <script>
    // 許可するMIMEタイプ
    const ALLOWED_TYPES = ['image/png', 'image/jpeg', 'image/jpg'];
    // 上限ファイルサイズ (例: 10MB)
    const MAX_FILE_SIZE = 10 * 1024 * 1024;

    // ファイル選択時の事前チェック
    function validateFileSelected(input) {
      const statusDiv = document.getElementById('statusMessage');
      statusDiv.className = '';
      statusDiv.innerHTML = '';

      const file = input.files[0];
      if (!file) return;

      // PDFなどの非対応形式をフロントで即時弾く
      if (!ALLOWED_TYPES.includes(file.type)) {
        statusDiv.className = 'error-message';
        statusDiv.innerText = 'エラー: PDF等の非対応形式です。PNGまたはJPEG画像を選択してください。';
        input.value = ''; // 選択キャンセル
        return;
      }

      // ファイルサイズチェック
      if (file.size > MAX_FILE_SIZE) {
        statusDiv.className = 'error-message';
        statusDiv.innerText = 'エラー: ファイルサイズが大きすぎます(10MB以下にしてください)。';
        input.value = '';
        return;
      }
    }

    // サーバー（GAS）へのファイル送信処理
    function uploadFile() {
      const input = document.getElementById('fileInput');
      const statusDiv = document.getElementById('statusMessage');
      const file = input.files[0];

      if (!file) {
        alert('ファイルを選択してください。');
        return;
      }

      statusDiv.className = '';
      statusDiv.innerText = '処理中... 画像を取り込んでいます。';

      const reader = new FileReader();
      reader.onload = function(e) {
        const fileData = {
          name: file.name,
          mimeType: file.type,
          base64: e.target.result.split(',')[1]
        };

        // GAS側の関数を実行
        google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(onFailure)
          .processImageFile(fileData);
      };

      reader.readAsDataURL(file);
    }

    function onSuccess(result) {
      const statusDiv = document.getElementById('statusMessage');
      statusDiv.className = 'success-message';
      statusDiv.innerText = '取り込みが完了しました！';
      console.log('抽出テキスト:', result);
    }

    function onFailure(error) {
      const statusDiv = document.getElementById('statusMessage');
      statusDiv.className = 'error-message';
      statusDiv.innerText = 'エラー: ' + error.message;
    }
  </script>
</body>
</html>
